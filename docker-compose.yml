name: wristalpha

x-app-runtime: &app-runtime
  image: ghcr.io/gdietzb04/wristalpha-api:${WRISTALPHA_IMAGE_TAG:-main}
  environment:
    WRISTALPHA_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    WRISTALPHA_DATABASE_HOST: db
    WRISTALPHA_DATABASE_PORT: "5432"
    WRISTALPHA_DATABASE_USER: ${POSTGRES_USER:-wristalpha}
    WRISTALPHA_DATABASE_NAME: ${POSTGRES_DB:-wristalpha}
    WRISTALPHA_CONFIG_PATH: /app/config/default.yaml
    WRISTALPHA_LOG_LEVEL: ${WRISTALPHA_LOG_LEVEL:-INFO}
    WRISTALPHA_SCHEDULE_INTERVAL_HOURS: ${WRISTALPHA_SCHEDULE_INTERVAL_HOURS:-6}
  secrets:
    - postgres_password
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  restart: unless-stopped
  volumes:
    - ./config:/app/config:ro
    - ./data:/app/data

services:
  db:
    image: timescale/timescaledb:2.28.3-pg16@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wristalpha}
      POSTGRES_USER: ${POSTGRES_USER:-wristalpha}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    <<: *app-runtime
    command: ["python", "-m", "wristalpha.operations.entrypoint", "api"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    <<: *app-runtime
    command: ["python", "-m", "wristalpha.operations.entrypoint", "scheduler"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: ghcr.io/gdietzb04/wristalpha-frontend:${WRISTALPHA_IMAGE_TAG:-main}
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 18
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

secrets:
  postgres_password:
    file: ${WRISTALPHA_SECRET_FILE:-.wristalpha/secrets/postgres_password}

volumes:
  postgres_data:
