[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wristalpha"
version = "0.2.0"
description = "Local-first luxury-watch price research and forecasting system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "WRISTALPHA" }]
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  "arch>=7.2,<9",
  "fastapi>=0.115,<1",
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "playwright>=1.49,<2",
  "polars>=1.17,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "statsmodels>=0.14,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12.20241230",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wristalpha"]
omit = ["src/wristalpha/operations/scheduler.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".uv-cache", ".uv-python", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/wristalpha/modeling/backtest.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "arch.*", "lightgbm.*", "statsmodels.*"]
ignore_missing_imports = true
